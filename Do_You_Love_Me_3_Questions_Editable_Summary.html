<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Do You Love Me?</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif}
.stage{position:relative;width:100vw;height:100vh;min-height:100svh;overflow:hidden;background:#000;isolation:isolate}
.reference{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center center;user-select:none;pointer-events:none}

.love-card{
position:absolute;left:50%;top:50%;width:clamp(330px,42vw,590px);
height:clamp(245px,38vh,390px);transform:translate(-50%,-50%);
border-radius:22px;overflow:visible;
background:linear-gradient(180deg,#fff 0%,#fff8fc 100%);
box-shadow:0 18px 50px rgba(0,0,0,.34),0 0 0 2px rgba(255,255,255,.8) inset,0 0 45px rgba(255,120,175,.2);
z-index:10;transform-origin:center
}

.title{position:absolute;top:9%;left:5%;width:90%;text-align:center;color:#8f163d;
font-size:clamp(22px,3vw,42px);line-height:1.08;font-weight:700;white-space:nowrap;z-index:4}
.title-heart{color:#c51e59;display:inline-block;margin-left:2px;animation:tinyBeat 1.1s ease-in-out infinite}
@keyframes tinyBeat{50%{transform:scale(1.15)}}
.art{position:absolute;left:18%;top:26%;width:64%;height:45%;object-fit:contain;user-select:none;pointer-events:none;mix-blend-mode:multiply}
.pink-heart{position:absolute;left:57%;top:33%;color:#f58cab;font-family:Arial,sans-serif;
font-size:clamp(28px,4vw,52px);line-height:1;z-index:3;transform:rotate(-10deg);
text-shadow:0 3px 8px rgba(255,50,110,.18)}
.mini-heart{position:absolute;color:#f28eb2;font-family:Arial,sans-serif;font-size:clamp(5px,1.9vw,10px);z-index:3}
.m1{left:25%;top:29%;transform:rotate(-18deg)}.m2{left:48%;top:24%;transform:rotate(14deg)}.m3{left:73%;top:48%;transform:rotate(18deg)}

.buttons{position:absolute;left:8%;right:8%;bottom:9%;height:24%;
display:flex;align-items:center;justify-content:center;gap:18px;z-index:20}
.btn{border:0;font-family:Georgia,"Times New Roman",serif;font-weight:700;cursor:pointer;
user-select:none;touch-action:manipulation;border-radius:999px;height:100%;
width:clamp(105px,12vw,175px);padding:0 18px;font-size:clamp(18px,2vw,29px);
transition:transform .25s cubic-bezier(.2,.9,.2,1),opacity .2s ease;
box-shadow:0 5px 14px rgba(0,0,0,.12)}
.yes{color:#a91b45;background:linear-gradient(180deg,#ffd1e2,#f8a7c4);box-shadow:0 2px 7px rgba(180,30,80,.16),inset 0 1px 0 rgba(255,255,255,.8)}
.no{color:#555;background:linear-gradient(180deg,#fff,#ece9eb);box-shadow:0 2px 6px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.9);position:relative;z-index:30}
.no.evasive{position:fixed;min-width:clamp(100px,10vw,145px);
width:clamp(100px,10vw,145px);height:clamp(44px,6vh,62px);padding:0;
font-size:clamp(16px,1.5vw,23px);z-index:999;
transition:left .16s cubic-bezier(.2,.8,.2,1),top .16s cubic-bezier(.2,.8,.2,1),
transform .16s cubic-bezier(.2,.8,.2,1)}
.yes.grow{animation:yesGrow .5s cubic-bezier(.2,.9,.2,1)}
@keyframes yesGrow{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.yes.pulse-now{animation:yesPulse .58s ease-in-out}
@keyframes yesPulse{
  0%{transform:scale(1)}
  38%{transform:scale(1.16)}
  58%{transform:scale(.97)}
  78%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

.success{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.2);width:76%;padding:14px 12px;text-align:center;color:#9d173e;background:rgba(255,247,251,.97);border-radius:13px;box-shadow:0 12px 35px rgba(0,0,0,.25);opacity:0;pointer-events:none;z-index:1000}
.success.show{animation:successIn .75s cubic-bezier(.15,.9,.2,1) forwards}
@keyframes successIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.success .big{font-size:clamp(18px,7vw,34px);margin-bottom:4px}
.success .main{font-size:clamp(11px,3.5vw,18px);font-weight:700}
.success .small{margin-top:5px;color:#c45178;font:700 clamp(7px,2.2vw,11px) Arial,sans-serif}
.confetti{position:absolute;width:5px;height:9px;border-radius:2px;pointer-events:none;z-index:1001;animation:confettiFly .9s ease-out forwards}
@keyframes confettiFly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999}
.flash.on{animation:flash .25s ease-out}
@keyframes flash{0%{opacity:.30}100%{opacity:0}}
</style>

<style>
@media (max-width:700px){
  .love-card{width:min(90vw,520px);height:min(48vh,360px);border-radius:18px}
  .title{font-size:clamp(22px,6.2vw,34px)}
  .buttons{gap:12px}
  .btn{width:clamp(105px,29vw,155px);font-size:clamp(18px,5vw,26px)}
}
@media (max-width:420px){
  .love-card{width:90vw;height:41vh;min-height:245px}
  .title{top:8%;font-size:clamp(21px,6.8vw,30px)}
  .buttons{bottom:8%;height:22%;gap:10px}
  .btn{width:39vw;height:100%;font-size:clamp(17px,5.3vw,23px)}
}
@media (min-width:701px){
  .love-card{width:min(42vw,590px);height:min(38vh,390px)}
}
</style>
</head>

<div class="pink-heart">♥</div>
<div class="mini-heart m1">♥</div><div class="mini-heart m2">♥</div><div class="mini-heart m3">♥</div>

<div class="buttons">
<button class="btn yes" id="yesBtn">Yes</button>
<button class="btn no" id="noBtn" type="button">No</button>
</div>
</section>

<div class="success" id="success">
<div class="big">💗</div>
<div class="main">I knew you'd say YES! 😭</div>
<div class="small">You can't escape my love 😂</div>
</div>
<div class="flash" id="flash"></div>
</div>

<script>
const SETTINGS = {
  // اكتبي أسئلتك وأجوبتك هون:
  questions: [
    { question: "Do You Love me?", yes: "YES", no: "NO" },
    { question: "هل انتي رح ضلي هيك بنفس العقلية للابد؟", yes: "Yes", no: "No" },
    { question: "ليش هيك بتعملي طيب؟", yes: "لانو هاي طبيعتي", no: "لاني مغصوبه هالاشي" }
  ],
  holdAfterAnswerMs: 1000
};

const stage = document.getElementById("stage");
const card = document.getElementById("card");
const title = card.querySelector(".title");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const success = document.getElementById("success");
const flash = document.getElementById("flash");

let questionIndex = 0;
let answers = [];
let attempts = 0;
let finished = false;
let answerLocked = false;

function escapeHtml(v){
  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderQuestion(){
  const q = SETTINGS.questions[questionIndex];

  title.innerHTML =
    '<span class="question-text">' +
    escapeHtml(q.question) +
    '</span><span class="title-heart">♥</span>';

  yesBtn.textContent = q.yes;
  noBtn.textContent = q.no;

  noBtn.classList.remove("evasive");
  noBtn.style.left = "";
  noBtn.style.top = "";
  noBtn.style.transform = "";
  noBtn.style.opacity = "1";
  noBtn.style.pointerEvents = "";

  yesBtn.classList.remove("pulse-now","grow");
  yesBtn.style.transform = "";

  attempts = 0;
  answerLocked = false;
}

function pulseYes(){
  yesBtn.classList.remove("pulse-now");
  void yesBtn.offsetWidth;
  yesBtn.classList.add("pulse-now");
}

function moveNo(){
  if(finished || answerLocked || questionIndex !== 0) return;

  attempts++;
  noBtn.classList.add("evasive");

  const cr = card.getBoundingClientRect();
  const nr = noBtn.getBoundingClientRect();

  const gap = Math.max(14, Math.min(36, Math.min(cr.width,cr.height)*.055));
  const pad = 8;

  const minX = Math.max(pad, cr.left - nr.width - gap);
  const maxX = Math.min(window.innerWidth - nr.width - pad, cr.right + gap - nr.width);

  const minY = Math.max(pad, cr.top - nr.height - gap);
  const maxY = Math.min(window.innerHeight - nr.height - pad, cr.bottom + gap - nr.height);

  const zones = [
    {x0:minX, x1:Math.min(maxX,cr.left-nr.width-gap/2), y0:minY, y1:maxY},
    {x0:Math.max(minX,cr.right+gap/2-nr.width), x1:maxX, y0:minY, y1:maxY},
    {x0:minX, x1:maxX, y0:minY, y1:Math.min(maxY,cr.top-nr.height-gap/2)},
    {x0:minX, x1:maxX, y0:Math.max(minY,cr.bottom+gap/2), y1:maxY}
  ].filter(z => z.x1 > z.x0 && z.y1 > z.y0);

  const z = zones[attempts % zones.length] || {
    x0:minX, x1:maxX, y0:minY, y1:maxY
  };

  const x = z.x0 + Math.random() * (z.x1-z.x0);
  const y = z.y0 + Math.random() * (z.y1-z.y0);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  noBtn.style.transform =
    "rotate(" + (Math.random()*12-6) + "deg) scale(" +
    (.94+Math.random()*.10) + ")";

  pulseYes();
}

function answerQuestion(value){
  if(finished || answerLocked) return;

  answerLocked = true;

  const q = SETTINGS.questions[questionIndex];
  answers.push({
    question:q.question,
    answer:value === "yes" ? q.yes : q.no,
    value
  });

  pulseYes();
  flash.classList.remove("on");
  void flash.offsetWidth;
  flash.classList.add("on");

  setTimeout(()=>{
    questionIndex++;
    if(questionIndex < SETTINGS.questions.length){
      renderQuestion();
    }else{
      showSummary();
    }
  }, SETTINGS.holdAfterAnswerMs);
}

function showSummary(){
  finished = true;
  card.style.opacity = "0";
  noBtn.style.opacity = "0";
  noBtn.style.pointerEvents = "none";

  const rows = answers.map((a,i)=>`
    <div class="answer-row">
      <div class="answer-q">Question ${i+1}: ${escapeHtml(a.question || "Your question")}</div>
      <div class="answer-a">${escapeHtml(a.answer)} ${a.value==="yes" ? "❤️" : "😂"}</div>
    </div>
  `).join("");

  success.innerHTML = `
    <div class="big">💗</div>
    <div class="main">Our Love Report 😂❤️</div>
    <div class="summary-note">The answers are officially recorded:</div>
    <div class="results">${rows}</div>
    <div class="summary-end">Final result: whatever you answered... you're still my favorite person 😌❤️</div>
  `;

  success.classList.remove("show");
  void success.offsetWidth;
  success.classList.add("show");
  burstConfetti();
}

function burstConfetti(){
  const r = stage.getBoundingClientRect();
  const cx = r.width/2, cy = r.height*.47;
  const symbols = ["♥","♥","✦","•","♡","✧"];

  for(let i=0;i<44;i++){
    const el = document.createElement("span");
    el.className = "confetti";
    el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    el.style.left = cx + "px";
    el.style.top = cy + "px";
    el.style.color = ["#ff4d98","#ff8fbc","#f7b5d0","#fff"][i%4];
    el.style.fontSize = (8+Math.random()*10)+"px";
    el.style.setProperty("--x",((Math.random()-.5)*r.width*.95)+"px");
    el.style.setProperty("--y",((Math.random()-.95)*r.height*.65)+"px");
    el.style.setProperty("--r",((Math.random()*760)-380)+"deg");
    stage.appendChild(el);
    setTimeout(()=>el.remove(),1000);
  }
}

/* First question only: No escapes forever.
   Questions 2 and 3: both buttons are normal clickable answers. */
noBtn.addEventListener("mouseenter",()=>{
  if(questionIndex===0) moveNo();
});

noBtn.addEventListener("touchstart",(e)=>{
  if(questionIndex===0){
    e.preventDefault();
    e.stopPropagation();
    moveNo();
  }
},{passive:false});

noBtn.addEventListener("pointerdown",(e)=>{
  if(questionIndex===0 && (e.pointerType==="touch" || e.pointerType==="pen")){
    e.preventDefault();
    e.stopPropagation();
    moveNo();
  }
});

noBtn.addEventListener("click",(e)=>{
  e.preventDefault();
  e.stopPropagation();

  if(questionIndex===0){
    moveNo();
  }else{
    answerQuestion("no");
  }
});

noBtn.addEventListener("focus",()=>{
  if(questionIndex===0) setTimeout(moveNo,0);
});

yesBtn.addEventListener("click",()=>{
  answerQuestion("yes");
});

addEventListener("resize",()=>{
  if(questionIndex===0 && !finished && !answerLocked && noBtn.classList.contains("evasive")){
    moveNo();
  }
});

renderQuestion();
</script>
</body>
</html>
